<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher Login · {{ settings.site_name }}</title><link rel="stylesheet" href="/static/styles.css"></head>
<body class="admin-body"><main class="login-wrap"><a class="brand login-brand" href="/"><span class="brand-mark">OC</span><span><strong>{{ settings.site_name }}</strong><small>Teacher workspace</small></span></a><section class="login-card"><span class="eyebrow">SECURE TEACHER AREA</span><h1>Welcome back.</h1><p>Sign in to publish lessons, videos, notes and announcements.</p>{% if error %}<div class="error-banner">{{ error }}</div>{% endif %}<form method="post" class="admin-form"><label>Username<input name="username" required autocomplete="username"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button class="button primary full">Sign in</button></form><small class="muted">Default demo login is documented in README. Change it before public deployment.</small></section></main></body></html>
