<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Class 11 and Class 12 Organic Chemistry concepts, videos, notes and resources.">
  <title>{% block title %}{{ settings.site_name }}{% endblock %}</title>
  <script>
    (() => {
      try {
        const saved = localStorage.getItem("oc-theme");
        const systemTheme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = saved || systemTheme;
      } catch (_) {
        document.documentElement.dataset.theme = "light";
      }
    })();
  </script>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body data-live-page="true" data-chem-motion="true">
  <div class="ambient ambient-a"></div>
  <div class="ambient ambient-b"></div>
  <header class="site-header">
    <a class="brand" href="/">
      <span class="brand-mark">OC</span>
      <span><strong>{{ settings.site_name }}</strong><small>Class 11 · Class 12</small></span>
    </a>
    <button class="nav-toggle" aria-label="Open menu" onclick="document.body.classList.toggle('nav-open')">☰</button>
    <nav class="liquid-tabbar" aria-label="Primary navigation">
      <span class="liquid-tabbar__slider" aria-hidden="true"></span>
      <a href="/class/11" data-nav-route="/class/11">Class 11</a>
      <a href="/class/12" data-nav-route="/class/12">Class 12</a>
      <a href="/videos" data-nav-route="/videos">Videos</a>
      <a href="/resources" data-nav-route="/resources">Resources</a>
      <a href="/announcements" data-nav-route="/announcements">Updates</a>
      <a href="/about" data-nav-route="/about">Teacher</a>
    </nav>
    <div class="header-tools">
      <form class="header-search" action="/search" method="get">
        <input type="search" name="q" placeholder="Search chemistry…" aria-label="Search chemistry">
      </form>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to dark theme" title="Switch theme">
        <svg class="theme-icon moon-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 15.3A8.5 8.5 0 0 1 8.7 3.8 8.5 8.5 0 1 0 20.2 15.3Z"/></svg>
        <svg class="theme-icon sun-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      </button>
    </div>
  </header>

  <main>{% block content %}{% endblock %}</main>

  <footer>
    <div><strong>{{ settings.site_name }}</strong><br><span>Organic chemistry that connects concepts to reactions.</span></div>
    <div class="footer-links"><a href="/class/11">Class 11</a><a href="/class/12">Class 12</a><a href="/admin/login">Teacher login</a></div>
  </footer>
  <div id="live-indicator" class="live-indicator"><span></span> Live content</div>
  <script src="/static/app.js"></script>
</body>
</html>
